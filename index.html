<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Learn the 50 States</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{
  height:100%;width:100%;background:#a8d8ea;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  color:#fff;-webkit-tap-highlight-color:transparent;
  overflow:hidden;position:fixed;top:0;left:0;right:0;bottom:0;
}
#app{display:flex;flex-direction:column;
  position:fixed;top:0;left:0;right:0;
  height:100vh;height:100dvh;}

/* Header */
#header{
  flex-shrink:0;background:#0f1f2f;border-bottom:2px solid #2a4a6a;
  padding:8px 12px;padding-top:calc(8px + env(safe-area-inset-top));
  display:flex;align-items:center;justify-content:space-between;gap:8px;
}
h1{font-size:17px;font-weight:700;color:#7dc8f0;}
.mode-btns{display:flex;gap:6px;}
.mode-btn{
  padding:7px 14px;border:2px solid #2a4a6a;border-radius:20px;
  background:transparent;color:#7dc8f0;font-size:13px;font-weight:600;
  cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;
}
.mode-btn.active{background:#2a6aaa;border-color:#4a9ada;color:#fff;}
#score-area{font-size:13px;font-weight:700;color:#ffe080;white-space:nowrap;display:none;}

/* Quiz bar */
#quiz-bar{
  flex-shrink:0;background:#0d2d4a;border-bottom:1px solid #1a5080;
  padding:6px 14px;text-align:center;display:none;
}
#quiz-prompt{font-size:15px;font-weight:700;color:#ffe080;}
#quiz-hint{font-size:11px;color:#9ab8cc;margin-top:1px;}
#progress-bar-wrap{flex-shrink:0;height:4px;background:#0f1f2f;display:none;}
#progress-bar{height:100%;background:linear-gradient(90deg,#2aaa5a,#7dc8f0);width:0%;transition:width 0.4s;}

/* ── MAIN: flex container below header ── */
#main{flex:1;min-height:0;display:flex;flex-direction:column;}

/* ── PORTRAIT: map area fills all remaining height, SVG scales to fill it ── */
#map-area{flex:1;min-height:0;background:#a8d8ea;position:relative;}
#map-svg{position:absolute;inset:0;width:100%;height:100%;display:block;}

/* State paths */
.sp{transition:opacity 0.12s,filter 0.12s;opacity:0.9;cursor:pointer;}
.sp.found{opacity:1;stroke:white!important;stroke-width:2.5!important;}
.sp.correct{opacity:1;stroke:white!important;stroke-width:2.5!important;}
.sp.active-tap{filter:brightness(1.4);opacity:1;}

#info-panel{
  flex-shrink:0;height:90px;display:flex;flex-direction:column;justify-content:center;
  padding:8px 16px;padding-bottom:calc(8px + env(safe-area-inset-bottom));
  background:#0f1f2f;border-top:2px solid #2a4a6a;text-align:center;
}
#info-empty{color:#3a6a8a;font-size:14px;}
#info-name{font-size:20px;font-weight:800;color:#ffe080;display:none;margin-bottom:4px;}
.info-row{font-size:13px;color:#c0d8ea;display:none;margin-top:3px;
  justify-content:center;gap:6px;align-items:center;}
.info-label{color:#5a8aaa;font-size:11px;text-transform:uppercase;font-weight:600;}
#explore-count{font-size:11px;color:#4a8aaa;margin-top:6px;display:none;}

/* Flash */
#flash{position:fixed;top:40%;left:50%;transform:translate(-50%,-50%);
  font-size:60px;pointer-events:none;opacity:0;z-index:200;transition:opacity 0.3s;}

/* Celebration */
#celebration{
  position:fixed;inset:0;background:rgba(0,0,0,0.92);display:none;
  flex-direction:column;align-items:center;justify-content:center;
  z-index:300;text-align:center;gap:14px;padding:20px;
}
#celebration .cel-emoji{font-size:72px;}
#celebration .cel-title{font-size:30px;font-weight:900;color:#ffe080;}
#celebration .cel-sub{font-size:16px;color:#9ab8cc;}
#celebration button{
  margin-top:6px;padding:14px 36px;background:#2a6aaa;border:none;
  border-radius:24px;color:#fff;font-size:17px;font-weight:700;
  cursor:pointer;touch-action:manipulation;
}

/* ── LANDSCAPE: side-by-side ── */
@media (orientation:landscape){
  #header{padding-top:calc(4px + env(safe-area-inset-top));padding-bottom:4px;}
  h1{font-size:14px;}
  .mode-btn{padding:5px 10px;font-size:12px;}
  #quiz-prompt{font-size:13px;}
  #quiz-hint{font-size:10px;}
  /* main becomes a row */
  #main{flex-direction:row;}
  /* map: left column, fills remaining width, height-driven SVG so all 50 states visible */
  #map-area{
    flex:1;min-height:0;position:relative;display:flex;
    align-items:center;justify-content:center;
    background:#a8d8ea;
  }
  #map-svg{position:static;width:auto;height:100%;}
  /* info panel: right column, fixed width */
  #info-panel{
    flex-shrink:0;width:200px;height:auto;
    border-top:none;border-left:2px solid #2a4a6a;
    padding:12px 14px;padding-right:calc(14px + env(safe-area-inset-right));
    padding-bottom:calc(12px + env(safe-area-inset-bottom));
    justify-content:center;
  }
  #info-name{font-size:16px;}
  .info-row{font-size:12px;}
}
</style>
</head>

var AK = {"name": "Alaska", "id": "alaska", "capital": "Juneau", "region": "West", "nickname": "The Last Frontier"};
var HI = {"name": "Hawaii", "id": "hawaii", "capital": "Honolulu", "region": "West", "nickname": "Aloha State"};
var ALL = STATES.concat([AK, HI]);

var mode='explore', quizDeck=[], currentTarget=null;
var quizScore=0, quizTotal=0, activeEl=null, foundCount=0;
var stateByName={};
for(var i=0;i<ALL.length;i++) stateByName[ALL[i].name]=ALL[i];

var svg=document.getElementById('map-svg');

function hitTest(cx,cy){
  var el=document.elementFromPoint(cx,cy);
  while(el&&el!==svg&&el!==document.body){
    if(el.classList&&el.classList.contains('sp')){
      var proxy=el.getAttribute('data-proxy');
      if(proxy){var p=document.getElementById(proxy);if(p)el=p;}
      var n=el.getAttribute('data-name');
      if(n){onTapped(el,n);return;}
    }
    el=el.parentNode;
  }
  clearInfo();
}

// Keep NE inset paths in sync with main map state paths
function syncNeInset(mainEl){
  var mainId=mainEl.id; // e.g. "state-connecticut"
  var neEl=document.getElementById('ne-'+mainId);
  if(!neEl) return;
  // Copy class list (found/correct/active-tap) and fill from main
  neEl.className.baseVal=mainEl.className.baseVal;
  neEl.style.fill=mainEl.style.fill||'';
}

svg.addEventListener('touchend',function(e){
  e.preventDefault();
  var t=e.changedTouches[0];
  hitTest(t.clientX,t.clientY);
},{passive:false});
svg.addEventListener('click',function(e){hitTest(e.clientX,e.clientY);});

function onTapped(el,name){
  if(mode==='explore') exploreState(el,name);
  else handleQuizTap(el,name);
}

function exploreState(el,name){
  var s=stateByName[name]; if(!s) return;
  if(activeEl&&activeEl!==el) activeEl.classList.remove('active-tap');
  el.classList.add('active-tap');
  activeEl=el;
  if(!el.classList.contains('found')){el.classList.add('found');foundCount++;}
  syncNeInset(el);
  showInfo(s);
}

function showInfo(s){
  document.getElementById('info-empty').style.display='none';
  document.getElementById('info-name').style.display='block';
  document.getElementById('info-name').textContent=s.name;
  ['row-cap','row-nick','row-region'].forEach(function(id){
    document.getElementById(id).style.display='flex';
  });
  document.getElementById('info-cap').textContent=s.capital;
  document.getElementById('info-nick').textContent=s.nickname;
  document.getElementById('info-region').textContent=s.region;
  if(mode==='explore'){
    document.getElementById('explore-count').style.display='block';
    document.getElementById('explore-count').textContent=foundCount+' of 50 explored';
  }
}

function clearInfo(){
  if(activeEl){activeEl.classList.remove('active-tap');activeEl=null;}
  document.getElementById('info-empty').style.display='block';
  document.getElementById('info-name').style.display='none';
  ['row-cap','row-nick','row-region'].forEach(function(id){
    document.getElementById(id).style.display='none';
  });
  document.getElementById('explore-count').style.display='none';
}

function buildDeck(){
  quizDeck=[];
  for(var i=0;i<ALL.length;i++) quizDeck.push(i);
  for(var j=quizDeck.length-1;j>0;j--){
    var k=Math.floor(Math.random()*(j+1));
    var t=quizDeck[j];quizDeck[j]=quizDeck[k];quizDeck[k]=t;
  }
  quizScore=0;quizTotal=0;updateScore();
}

function nextQ(){
  if(quizDeck.length===0){celebrate();return;}
  currentTarget=ALL[quizDeck.pop()];
  document.getElementById('quiz-prompt').textContent='Tap: '+currentTarget.name;
  document.getElementById('quiz-hint').textContent=currentTarget.capital+' · '+currentTarget.nickname;
  clearInfo();
}

function handleQuizTap(el,name){
  if(!currentTarget) return;
  if(name===currentTarget.name){
    el.classList.add('correct');
    syncNeInset(el);
    quizScore++;quizTotal++;updateScore();flash(true);
    showInfo(stateByName[name]);
    currentTarget=null;setTimeout(nextQ,900);
  }else{
    var orig=el.style.fill;
    el.style.fill='#cc2222';
    syncNeInset(el);
    setTimeout(function(){el.style.fill=orig;syncNeInset(el);},600);
    quizTotal++;updateScore();flash(false);
  }
}

function updateScore(){
  var found=document.querySelectorAll('.sp.correct').length;
  document.getElementById('score-area').textContent=found+' / 50';
  document.getElementById('progress-bar').style.width=(found/50*100)+'%';
}

function flash(ok){
  var fl=document.getElementById('flash');
  fl.textContent=ok?'✅':'❌';
  fl.style.opacity='1';
  setTimeout(function(){fl.style.opacity='0';},500);
}

function celebrate(){
  var acc=quizTotal?Math.round(quizScore/quizTotal*100):100;
  document.getElementById('cel-sub').textContent='Accuracy: '+acc+'%';
  document.getElementById('celebration').style.display='flex';
}

function restartQuiz(){
  document.getElementById('celebration').style.display='none';
  resetStates();buildDeck();nextQ();
}

function resetStates(){
  document.querySelectorAll('.sp').forEach(function(p){
    p.className.baseVal='sp';
    p.style.fill=p.getAttribute('data-color');
  });
  clearInfo();currentTarget=null;foundCount=0;
}

function setMode(m){
  mode=m;
  document.getElementById('btn-explore').classList.toggle('active',m==='explore');
  document.getElementById('btn-quiz').classList.toggle('active',m==='quiz');
  document.getElementById('quiz-bar').style.display=m==='quiz'?'block':'none';
  document.getElementById('progress-bar-wrap').style.display=m==='quiz'?'block':'none';
  document.getElementById('score-area').style.display=m==='quiz'?'block':'none';
  document.getElementById('info-empty').textContent=
    m==='explore'?'Tap any state to learn about it':'Tap the correct state!';
  resetStates();
  if(m==='quiz'){buildDeck();nextQ();}
}
</script>
</body>
</html>
