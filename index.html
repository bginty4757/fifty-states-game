<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Learn the 50 States</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{
  height:100%;width:100%;
  background:#1a2a3a;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  color:#fff;
  -webkit-tap-highlight-color:transparent;
  overflow:hidden;
  position:fixed;
  top:0;left:0;right:0;bottom:0;
}
#app{
  display:flex;flex-direction:column;
  height:100%;width:100%;
  position:fixed;
  top:0;left:0;right:0;bottom:0;
}
#header{
  flex-shrink:0;
  background:#0f1f2f;
  border-bottom:2px solid #2a4a6a;
  padding:10px 14px;
  padding-top:calc(10px + env(safe-area-inset-top));
  display:flex;align-items:center;justify-content:space-between;gap:8px;
}
#header h1{font-size:18px;font-weight:700;color:#7dc8f0;}
.mode-btns{display:flex;gap:8px;}
.mode-btn{
  padding:8px 16px;border:2px solid #2a4a6a;border-radius:20px;
  background:transparent;color:#7dc8f0;font-size:14px;font-weight:600;
  cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;
}
.mode-btn.active{background:#2a6aaa;border-color:#4a9ada;color:#fff;}
#score-area{font-size:14px;font-weight:700;color:#ffe080;white-space:nowrap;min-width:60px;text-align:right;display:none;}
#quiz-bar{
  flex-shrink:0;background:#0d2d4a;border-bottom:2px solid #1a5080;
  padding:8px 16px;text-align:center;display:none;
}
#quiz-prompt{font-size:16px;font-weight:700;color:#ffe080;}
#quiz-hint{font-size:12px;color:#9ab8cc;margin-top:2px;}
#progress-bar-wrap{flex-shrink:0;height:5px;background:#0f1f2f;display:none;}
#progress-bar{height:100%;background:linear-gradient(90deg,#2aaa5a,#7dc8f0);width:0%;transition:width 0.4s;}
#map-area{
  flex:1;min-height:0;width:100%;
  display:flex;align-items:center;justify-content:center;
  background:#1a2a3a;
}
#map-svg{width:100%;height:100%;display:block;}
.state-path{fill:#2a5a8a;stroke:#0f1f2f;stroke-width:1;transition:fill 0.12s;}
.state-path.active-tap{fill:#3a8abf;}
.state-path.correct{fill:#1a7a4a;stroke:#0a4a2a;}
.state-path.wrong{fill:#cc3030;}
.state-path.found{fill:#1a7a4a;stroke:#0a4a2a;}

/* Bottom drawer */
#info-drawer{
  position:fixed;left:0;right:0;bottom:0;
  background:#0d2d4a;
  border-top:2px solid #4a9ada;
  border-radius:18px 18px 0 0;
  padding:14px 20px;
  padding-bottom:calc(14px + env(safe-area-inset-bottom));
  transform:translateY(100%);
  transition:transform 0.28s cubic-bezier(0.32,0.72,0,1);
  z-index:100;
}
#info-drawer.open{transform:translateY(0);}
#drawer-handle{width:36px;height:4px;background:#2a5a8a;border-radius:2px;margin:0 auto 12px;}
#drawer-name{font-size:22px;font-weight:800;color:#ffe080;margin-bottom:6px;}
.drawer-row{font-size:14px;color:#c0d8ea;margin-top:5px;display:flex;gap:8px;align-items:center;}
.drawer-label{color:#5a8aaa;font-size:12px;text-transform:uppercase;font-weight:600;min-width:60px;}

#flash{
  position:fixed;top:45%;left:50%;transform:translate(-50%,-50%);
  font-size:64px;pointer-events:none;opacity:0;z-index:200;transition:opacity 0.3s;
}
#celebration{
  position:fixed;inset:0;background:rgba(0,0,0,0.88);
  display:none;flex-direction:column;align-items:center;justify-content:center;
  z-index:300;text-align:center;gap:16px;padding:20px;
}
#celebration .cel-emoji{font-size:80px;}
#celebration .cel-title{font-size:36px;font-weight:900;color:#ffe080;}
#celebration .cel-sub{font-size:18px;color:#9ab8cc;}
#celebration button{
  margin-top:8px;padding:16px 40px;background:#2a6aaa;border:none;
  border-radius:24px;color:#fff;font-size:18px;font-weight:700;
  cursor:pointer;touch-action:manipulation;
}
</style>
</head>
<body>
<div id="app">
  <div id="header">
    <h1>&#128506; 50 States</h1>
    <div class="mode-btns">
      <button class="mode-btn active" id="btn-explore" onclick="setMode('explore')">Explore</button>
      <button class="mode-btn" id="btn-quiz" onclick="setMode('quiz')">Quiz Me!</button>
    </div>
    <div id="score-area">0 / 50</div>
  </div>
  <div id="quiz-bar">
    <div id="quiz-prompt"></div>
    <div id="quiz-hint"></div>
  </div>
  <div id="progress-bar-wrap"><div id="progress-bar"></div></div>
  <div id="map-area">
    <svg id="map-svg" viewBox="0 0 960 600" preserveAspectRatio="xMidYMid meet">
      <g id="states-group"></g>
    </svg>
  </div>
</div>

<div id="info-drawer">
  <div id="drawer-handle"></div>
  <div id="drawer-name"></div>
  <div class="drawer-row"><span class="drawer-label">Capital</span><span id="drawer-cap"></span></div>
  <div class="drawer-row"><span class="drawer-label">Nickname</span><span id="drawer-nick"></span></div>
  <div class="drawer-row"><span class="drawer-label">Region</span><span id="drawer-region"></span></div>
</div>

<div id="flash"></div>
<div id="celebration">
  <div class="cel-emoji">&#127881;</div>
  <div class="cel-title">All 50 States!</div>
  <div class="cel-sub" id="cel-sub"></div>
  <button onclick="restartQuiz()">Play Again</button>
</div>

var mode = 'explore';
var quizDeck = [];
var currentTarget = null;
var quizScore = 0;
var quizTotal = 0;
var drawerTimer = null;
var activeEl = null;
var stateByName = {};
for (var i = 0; i < STATES.length; i++) stateByName[STATES[i].name] = STATES[i];

function buildMap() {
  var g = document.getElementById('states-group');
  g.innerHTML = '';
  for (var i = 0; i < STATES.length; i++) {
    var s = STATES[i];
    var path = document.createElementNS('http://www.w3.org/2000/svg','path');
    path.setAttribute('d', s.path);
    path.setAttribute('class','state-path');
    path.setAttribute('id','state-'+s.id);
    path.setAttribute('data-name', s.name);
    g.appendChild(path);
  }
}

function getStateEl(name) {
  return document.getElementById('state-'+name.toLowerCase().replace(/ /g,'-'));
}

// Single touch handler on SVG using elementFromPoint — most reliable on iOS
var svg = document.getElementById('map-svg');

function handleSVGInput(clientX, clientY) {
  var el = document.elementFromPoint(clientX, clientY);
  while (el && el !== svg && el !== document.body) {
    if (el.classList && el.classList.contains('state-path')) {
      var name = el.getAttribute('data-name');
      if (name) { onStateTapped(el, name); return true; }
    }
    el = el.parentNode;
  }
  return false;
}

svg.addEventListener('touchend', function(evt) {
  evt.preventDefault();
  var t = evt.changedTouches[0];
  var hit = handleSVGInput(t.clientX, t.clientY);
  if (!hit) closeDrawer();
}, {passive: false});

svg.addEventListener('click', function(evt) {
  var hit = handleSVGInput(evt.clientX, evt.clientY);
  if (!hit) closeDrawer();
});

function onStateTapped(el, name) {
  if (mode === 'explore') {
    showDrawer(el, name);
    if (!el.classList.contains('found')) el.classList.add('found');
  } else {
    handleQuizTap(el, name);
  }
}

function showDrawer(el, name) {
  var s = stateByName[name];
  if (!s) return;
  if (activeEl && activeEl !== el) activeEl.classList.remove('active-tap');
  el.classList.add('active-tap');
  activeEl = el;
  document.getElementById('drawer-name').textContent = s.name;
  document.getElementById('drawer-cap').textContent = s.capital;
  document.getElementById('drawer-nick').textContent = s.nickname;
  document.getElementById('drawer-region').textContent = s.region;
  document.getElementById('info-drawer').classList.add('open');
  if (drawerTimer) clearTimeout(drawerTimer);
  drawerTimer = setTimeout(closeDrawer, 5000);
}

function closeDrawer() {
  document.getElementById('info-drawer').classList.remove('open');
  if (activeEl) { activeEl.classList.remove('active-tap'); activeEl = null; }
  if (drawerTimer) { clearTimeout(drawerTimer); drawerTimer = null; }
}

document.getElementById('info-drawer').addEventListener('touchend', function(e){e.stopPropagation();closeDrawer();},{passive:false});
document.getElementById('info-drawer').addEventListener('click', function(e){e.stopPropagation();closeDrawer();});

function buildDeck() {
  quizDeck = [];
  for (var i = 0; i < STATES.length; i++) quizDeck.push(i);
  for (var j = quizDeck.length-1; j > 0; j--) {
    var k = Math.floor(Math.random()*(j+1));
    var tmp=quizDeck[j];quizDeck[j]=quizDeck[k];quizDeck[k]=tmp;
  }
  quizScore=0;quizTotal=0;updateScoreDisplay();
}

function nextQuestion() {
  if (quizDeck.length===0){showCelebration();return;}
  var idx = quizDeck.pop();
  currentTarget = STATES[idx];
  document.getElementById('quiz-prompt').textContent = 'Tap: '+currentTarget.name;
  document.getElementById('quiz-hint').textContent = currentTarget.capital+' · '+currentTarget.nickname;
}

function handleQuizTap(el, name) {
  if (!currentTarget) return;
  if (name === currentTarget.name) {
    el.classList.add('correct');
    quizScore++;quizTotal++;updateScoreDisplay();showFlash('correct');
    currentTarget=null;setTimeout(nextQuestion,700);
  } else {
    el.classList.add('wrong');
    setTimeout(function(){el.classList.remove('wrong');},600);
    quizTotal++;updateScoreDisplay();showFlash('wrong');
  }
}

function updateScoreDisplay() {
  var found = document.querySelectorAll('.state-path.correct').length;
  document.getElementById('score-area').textContent = found+' / 50';
  document.getElementById('progress-bar').style.width = (found/50*100)+'%';
}

function showFlash(type) {
  var fl = document.getElementById('flash');
  fl.textContent = type==='correct' ? '\u2705' : '\u274c';
  fl.style.opacity='1';
  setTimeout(function(){fl.style.opacity='0';},500);
}

function showCelebration() {
  var acc = quizTotal ? Math.round(quizScore/quizTotal*100) : 100;
  document.getElementById('cel-sub').textContent = 'Accuracy: '+acc+'%';
  document.getElementById('celebration').style.display='flex';
}

function restartQuiz() {
  document.getElementById('celebration').style.display='none';
  resetAllStates();buildDeck();nextQuestion();
}

function resetAllStates() {
  var paths = document.querySelectorAll('.state-path');
  for(var i=0;i<paths.length;i++) paths[i].className='state-path';
  closeDrawer();currentTarget=null;
}

function setMode(m) {
  mode=m;
  document.getElementById('btn-explore').classList.toggle('active',m==='explore');
  document.getElementById('btn-quiz').classList.toggle('active',m==='quiz');
  document.getElementById('quiz-bar').style.display = m==='quiz'?'block':'none';
  document.getElementById('progress-bar-wrap').style.display = m==='quiz'?'block':'none';
  document.getElementById('score-area').style.display = m==='quiz'?'block':'none';
  resetAllStates();
  if(m==='quiz'){buildDeck();nextQuestion();}
}

buildMap();
</script>
